<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MerlinsLockIN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07060d">
<link rel="manifest" href="site.webmanifest" data-web-only>
<link rel="icon" href="icon32.png" data-web-only>
<link rel="apple-touch-icon" href="icon192.png" data-web-only>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">
      <button type="button" class="ghost icon-only m-back" id="m-back" hidden data-i18n-title="nav_back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="hatg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="hat-top"/><stop offset="1" class="hat-bottom"/></linearGradient>
        </defs>
        <path class="lg-hat" d="M14 24 C17 16 19.5 9 28.5 3 C26.5 9.5 29 16 34 24 Z"/>
        <path class="lg-band" d="M16.4 20.4 C21 21.6 27 21.6 31.9 20.4"/>
        <ellipse class="lg-brim" cx="24" cy="24.6" rx="15.5" ry="3.1"/>
        <path class="lg-chain" d="M23.6 33.4 C20.5 36.5 19 41 12.5 44.5"/>
        <circle class="lg-lens" cx="29" cy="33" r="5.3"/>
        <path class="lg-glint" d="M26.1 31.4 A3.5 3.5 0 0 1 29.6 29.6"/>
      </svg>
      <div class="brand-text">
        <h1>Merlins<span>LockIN</span></h1>
        <button type="button" class="m-title" id="m-title"></button>
        <button type="button" class="seq" id="seq-badge">
          <span id="seq-label">Sequence 9 · Seer</span>
          <i class="seq-bar"><b id="seq-fill"></b></i>
        </button>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="gold" id="gold-chip" data-i18n-title="shop"></button>
      <span class="buff" id="buff-chip"></span>
      <span class="streak" id="streak-pill"></span>
      <button type="button" class="ghost icon-only" id="install-btn" data-i18n-title="install_app" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="float-btn" data-i18n-title="float_timer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="search-btn" data-i18n-title="k_title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="sound-btn" data-i18n-title="snd_title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V6l10-2v11"/><circle cx="6.5" cy="17" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="quick-btn" data-i18n-title="qt_title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="mute-btn" aria-pressed="false" data-i18n-title="mute_all">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="mute-on" d="M16 9l5 6M21 9l-5 6"/><path class="mute-off" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button type="button" class="ghost icon-only" id="settings-btn" data-i18n-title="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3h3.4l.5 2.4 1.7 1 2.3-.8 1.7 2.9-1.8 1.6v2l1.8 1.6-1.7 2.9-2.3-.8-1.7 1-.5 2.4h-3.4l-.5-2.4-1.7-1-2.3.8-1.7-2.9 1.8-1.6v-2L3.9 8.5l1.7-2.9 2.3.8 1.7-1z"/><circle cx="12" cy="12" r="2.8"/></svg>
      </button>
    </div>
  </header>

  <!-- Sport is set aside since 3.25 (sport.js / sport-data.js stay in the repo, not loaded): only Work is left, so no switch -->
  <div class="section-switch" role="group" aria-label="Section" hidden>
    <button type="button" id="sec-work" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v14H4zM13 5h7v14h-7zM6.5 9h2M15.5 9h2"/></svg><span data-i18n="sec_work">Travail</span></button>
    <button type="button" id="sec-sport" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg><span data-i18n="sec_sport">Sport</span></button>
  </div>

  <div class="work-only" id="work-root">
  <div class="layout">
    <!-- Left zone on a computer (3.60): energy, world, dial, sound. It stays put while the work zone scrolls. -->
    <div class="session" id="session">
    <section class="moodbar" aria-label="Mood">
      <div class="mood-chips" id="mood-chips" role="group"></div>
      <div class="mood-foot"><p class="mood-line" id="mood-line"></p></div>
    </section>
    <section class="sigil-card" id="sigil-card">
      <div class="card-head">
        <button type="button" class="ghost icon-only m-close" id="m-close" data-i18n-title="nav_back_screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="seg-toggle" role="group">
          <button type="button" id="m-focus" aria-pressed="true" data-i18n="focus">Focus</button>
          <button type="button" id="m-break" aria-pressed="false" data-i18n="break">Pause</button>
        </div>
        <button type="button" class="ghost icon-only" id="deep-btn" data-i18n-title="deep_focus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button type="button" class="ghost icon-only" id="compact-btn" data-i18n-title="compact_toggle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16"/></svg>
        </button>
      </div>

      <div class="cbar" id="cbar">
        <div class="cbar-main">
          <span class="state" id="c-state"></span>
          <span class="cbar-clock" id="c-clock">40:00</span>
          <span class="cbar-task" id="c-task"></span>
        </div>
        <div class="cbar-prog"><b id="c-prog"></b></div>
        <div class="cbar-btns">
          <button type="button" class="primary small" id="c-start"></button>
          <button type="button" class="small" id="c-skip" data-i18n="finish">Terminer</button>
        </div>
      </div>

      <div class="full-only">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
            <g class="runes" id="runes"></g>
            <g class="segs-dim" id="segs-dim"></g>
            <g class="segs-lit" id="segs-lit"></g>
            <circle class="arc-track" cx="120" cy="120" r="76"/>
            <circle class="arc" id="arc" cx="120" cy="120" r="76"/>
            <polygon class="hex" id="hex"/>
            <polygon class="tip" id="tip" points="120,25 115,16 125,16"/>
          </svg>
          <div class="ring-center">
            <div class="state" id="state"></div>
            <div class="clock" id="clock" role="timer" aria-live="off">40:00</div>
            <div class="focus-on" id="focus-on"></div>
          </div>
        </div>
      </div>

      <div class="rate" id="rate" hidden>
        <p data-i18n="rate_q">À quel point étais-tu concentré ?</p>
        <div class="rate-btns" id="rate-btns" role="group"></div>
        <button type="button" class="link" id="rate-skip" data-i18n="skip">Passer</button>
      </div>

      <div class="full-only">
        <div class="presets" id="presets" role="group"></div>
        <div class="custom">
          <label for="custom-hrs" data-i18n="custom">Perso</label>
          <input type="number" id="custom-hrs" min="0" max="10" placeholder="h" inputmode="numeric" aria-label="h">
          <input type="number" id="custom-mins" min="0" max="600" placeholder="min" inputmode="numeric" aria-label="min">
          <button type="button" id="custom-set" data-i18n="set">OK</button>
        </div>
        <div class="controls">
          <button type="button" id="reset" data-i18n="reset">Annuler</button>
          <button type="button" class="primary" id="start"></button>
          <button type="button" id="skip" data-i18n="finish">Terminer</button>
          <button type="button" class="link stuck-btn" id="stuck-btn" data-i18n="st_btn"></button>
        </div>
      </div>

      <div class="sess-tools" id="sess-tools"></div>

      <form class="park" id="park-form" autocomplete="off">
        <input type="text" id="park-input" maxlength="140" data-i18n-ph="park_ph">
        <button type="submit" data-i18n="park">Parquer</button>
        <button type="button" class="distract-btn" id="distract-btn" data-i18n-title="distracted">⚡ <span id="distract-n"></span></button>
      </form>
      <label class="outside-tog" id="outside-row" hidden><input type="checkbox" id="outside-chk"> <span data-i18n="outside_work"></span></label>

      <div class="perch" id="perch"></div>

      <div class="deck" id="sound-deck"></div>
    </section>
    </div>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="t-plan" aria-controls="tab-plan"><span data-i18n="tab_plan">Plan</span> <span class="count" id="park-count"></span></button>
        <button type="button" role="tab" id="sp-study" data-space="study" data-i18n="sp_study">Étude</button>
        <button type="button" role="tab" id="sp-you" data-space="you" data-i18n="sp_you">Toi</button>
        <button type="button" class="k-btn" id="k-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span data-i18n="k_title"></span><kbd>Ctrl K</kbd></button>
        <span class="tab-clock" id="tab-clock" hidden></span>
        <button type="button" class="tab-ico" id="rail-btn" aria-pressed="false" data-i18n-title="rail_hide"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M9.5 5v14"/></svg></button>
        <button type="button" class="tab-ico" id="full-btn" aria-pressed="false" data-i18n-title="full_on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <!-- Phone: List / Day / Month at the top of the Plan space -->
      <div class="m-seg" id="m-seg" role="group" hidden></div>
      <!-- Every section of the current space: a column on a computer (3.60). Phones have home pages instead (today.js). -->
      <div class="subtabs" id="subtabs" role="tablist" hidden>
        <!-- The Plan's sections fold into groups (nav.js) -->
        <button type="button" class="sub-grp" data-in="plan" data-grp="tasks"><span data-i18n="grp_tasks"></span><small></small></button>
        <div class="sub-fold" data-in="plan" data-fold="tasks">
          <button type="button" data-sp="plan" data-pvw="next" data-i18n="pl_v_next"></button>
          <button type="button" data-sp="plan" data-pvw="today" data-i18n="pl_v_today"></button>
          <button type="button" data-sp="plan" data-pvw="upcoming" data-i18n="pl_v_upcoming"></button>
          <button type="button" data-sp="plan" data-pvw="all" data-i18n="pl_v_all"></button>
          <button type="button" data-sp="plan" data-pvw="inbox"><span data-i18n="pl_v_inbox"></span> <span class="count" id="sub-inbox"></span></button>
          <!-- the projects, right under the views and always open (3.70): a filter that works in every view -->
          <div class="sub-projs" id="sub-proj"></div>
        </div>
        <button type="button" class="sub-grp" data-in="plan" data-grp="sched"><span data-i18n="grp_sched"></span><small></small></button>
        <div class="sub-fold" data-in="plan" data-fold="sched">
          <button type="button" role="tab" id="t-day" data-sp="plan" aria-controls="tab-day" data-i18n="tab_day">Journée</button>
          <button type="button" role="tab" id="t-cal" data-sp="plan" aria-controls="tab-cal" data-i18n="tab_cal">Agenda</button>
        </div>
        <button type="button" role="tab" id="t-notes" data-sp="study" aria-controls="tab-notes"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6"/></svg><span data-i18n="tab_notes">Carnet</span></button>
        <button type="button" role="tab" id="t-lib" data-sp="study" aria-controls="tab-lib"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l4 15"/></svg><span data-i18n="tab_lib">Bibliothèque</span> <svg class="lock-ico" id="lib-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
        <button type="button" role="tab" id="t-study" data-sp="study" aria-controls="tab-study"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h12v12"/></svg><span data-i18n="tab_cards">Cartes</span> <svg class="lock-ico" id="study-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><em class="sub-n" id="sub-n-cards"></em></button>
        <button type="button" role="tab" id="t-subjects" data-sp="study" aria-controls="tab-subjects"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span data-i18n="tab_subjects">Matières</span><em class="sub-n" id="sub-n-subjects"></em></button>
        <button type="button" role="tab" id="t-lectures" data-sp="study" aria-controls="tab-lectures"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="tab_lectures">Cours</span></button>
        <button type="button" role="tab" id="t-learn" data-sp="study" aria-controls="tab-learn"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span data-i18n="tab_learn">Apprendre</span></button>
        <button type="button" role="tab" id="t-room" data-sp="study" aria-controls="tab-room"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.5"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M14.5 14.6c2.6-.4 4.9.9 5.6 3.9"/></svg><span data-i18n="tab_room">Salle</span></button>
        <!-- You (3.66): the Tree first, then Progress, The game (module), Wellbeing (module); the Shop and the Guide at the end -->
        <button type="button" role="tab" id="t-tree" data-sp="you" aria-controls="tab-tree"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8M12 13l-4-3M12 15l4-4"/><path d="M7 11a5 5 0 1 1 10 0 4 4 0 0 1-2 3.5H9A4 4 0 0 1 7 11z"/></svg><span data-i18n="tab_tree">Arbre</span></button>
        <button type="button" role="tab" id="t-focus" data-sp="you" aria-controls="tab-focus"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16v-4M12 16V8M17 16V5"/></svg><span data-i18n="tab_focus">Progrès</span></button>
        <button type="button" role="tab" id="t-grim" data-sp="you" data-mod="game" aria-controls="tab-grim"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V9l6-5 6 5v12zM10 21v-5h4v5M9 11h6"/></svg><span data-i18n="tab_grim">Le jeu</span></button>
        <button type="button" role="tab" id="t-health" data-sp="you" data-mod="wellbeing" aria-controls="tab-health"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-i18n="tab_health">Bien-être</span></button>
        <button type="button" id="t-shop" data-sp="you"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg><span data-i18n="shop">Boutique</span></button>
        <button type="button" role="tab" id="t-guide" data-sp="you" aria-controls="tab-guide"><svg class="sub-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M10 9.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V13M12 16.2v.1"/></svg><span data-i18n="tab_guide">Guide</span></button>
      </div>

      <div class="tabpanel" id="tab-today" role="tabpanel" hidden><div id="today"></div></div>
      <div class="tabpanel" id="tab-shome" role="tabpanel" hidden><div id="shome"></div></div>
      <div class="tabpanel" id="tab-yhome" role="tabpanel" hidden><div id="yhome"></div></div>
      <div class="tabpanel" id="tab-plan" role="tabpanel">
        <div id="quest-strip"></div>
        <form class="add" id="add-form" autocomplete="off">
          <input type="text" id="new-title" maxlength="120" required data-i18n-ph="new_task_ph">
          <select id="new-mins" aria-label="Duration">
            <option value="15">15 min</option><option value="25">25 min</option><option value="30">30 min</option>
            <option value="35">35 min</option><option value="40">40 min</option><option value="45">45 min</option>
            <option value="60" selected>1h</option><option value="90">1h30</option><option value="120">2h</option><option value="180">3h</option>
          </select>
          <select id="new-pri" aria-label="Priority">
            <option value="high" data-i18n="pri_high">Haute</option><option value="med" selected data-i18n="pri_med">Moyenne</option><option value="low" data-i18n="pri_low">Basse</option>
          </select>
          <button type="submit" class="primary add-btn" data-i18n="add_task">Ajouter au plan</button>
        </form>
        <p class="sort-note" id="sort-note"></p>
        <ul class="tasks" id="tasks"></ul>
        <div class="plan-foot">
          <span id="foot-note"></span>
        </div>
        <div class="log">
          <h2 data-i18n="today_sessions">Sessions du jour</h2>
          <ol id="log"></ol>
        </div>
        <!-- The Inbox view of the Plan (Parked until 3.56): plan.js shows it instead of the rest of this tab -->
        <div class="pl-inbox" id="tab-park" hidden>
          <p class="hint" data-i18n="park_hint"></p>
          <ul class="parked" id="parked"></ul>
          <div class="plan-foot"><span></span><button type="button" class="ghost small" id="clear-parked" data-i18n="clear_all">Tout effacer</button></div>
        </div>
      </div>

      <div class="tabpanel" id="tab-day" role="tabpanel" hidden><div id="planner"></div></div>
      <div class="tabpanel" id="tab-cal" role="tabpanel" hidden><div id="calendar"></div></div>
      <div class="tabpanel" id="tab-notes" role="tabpanel" hidden><div id="notes"></div></div>

      <div class="tabpanel" id="tab-focus" role="tabpanel" hidden><div id="focus"></div></div>
      <div class="tabpanel" id="tab-tree" role="tabpanel" hidden><div id="tree"></div></div>
      <div class="tabpanel" id="tab-health" role="tabpanel" hidden><div class="wb-page"><div id="health"></div><div id="screen"></div></div></div>
      <div class="tabpanel" id="tab-grim" role="tabpanel" hidden>
        <div class="grim" id="grim"></div>
        <div class="grim" id="g-game"></div>
      </div>
      <div class="tabpanel" id="tab-study" role="tabpanel" hidden><div id="study"></div></div>
      <div class="tabpanel" id="tab-lib" role="tabpanel" hidden><div class="st-body" id="library"></div></div>
      <div class="tabpanel" id="tab-learn" role="tabpanel" hidden><div id="learn"></div></div>
      <div class="tabpanel" id="tab-subjects" role="tabpanel" hidden><div id="subjects"></div></div>
      <div class="tabpanel" id="tab-lectures" role="tabpanel" hidden><div id="lectures"></div></div>
      <div class="tabpanel" id="tab-room" role="tabpanel" hidden><div class="st-body" id="room-root"></div></div>
      <div class="tabpanel" id="tab-guide" role="tabpanel" hidden><div id="guide"></div></div>
    </section>
  </div>
  </div>

  <div class="sport-root" id="sport-root" hidden></div>
</div>

<!-- Phone / side panel navigation (nav.js): the add button and the bottom bar with its dial, under 900px wide -->
<button type="button" class="m-fab" id="m-fab" hidden data-i18n-title="add_task">+</button>
<nav class="mnav" id="mnav" aria-label="Navigation"></nav>
<div class="overlay" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-h">
    <div class="sheet-head">
      <h2 id="set-h" data-i18n="settings"></h2>
      <button type="button" class="ghost icon-only" data-close="settings" data-i18n-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="settings-body"></div>
  </div>
</div>

<div class="overlay" id="help" hidden>
